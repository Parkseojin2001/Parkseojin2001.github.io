---
layout: page
# The layout for Tag page: same list format as the blog
---

{% capture _name %}#{{ page.title }}{% endcapture %}
<div id="page-tag" class="listing-page">
  {% include listing-head.html kind='tags' name=_name %}
  <div class="listing">
    {% for post in page.posts %}
      {% include post-item.html post=post %}
    {% endfor %}
  </div>
</div>
