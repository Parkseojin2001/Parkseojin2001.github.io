---
layout: page
# The Category layout: same list format as the blog
---

<div id="page-category" class="listing-page">
  {% include listing-head.html kind='categories' name=page.title %}
  <div class="listing">
    {% for post in page.posts %}
      {% include post-item.html post=post %}
    {% endfor %}
  </div>
</div>
