# 글 섹션(상단 메뉴)의 이름과 설명.
# 글 front matter에 `section: <slug>`를 쓰면 /<slug>/ 목록 페이지와 상단 메뉴가 자동으로 생긴다.
# 여기에 없는 섹션은 slug 첫 글자를 대문자로 바꾼 이름(travel → Travel)을 쓰고 설명은 생략한다.
# 메뉴 순서는 이 파일에 적힌 순서이고, 여기에 없는 섹션은 그 뒤에 알파벳순으로 붙는다.

