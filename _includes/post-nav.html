<!-- Navigation links at the bottom of the post: older (previous) / newer (next). -->

<nav class="post-navigation" aria-label="Post Navigation">
  {% if page.previous.url %}
    <a class="post-nav-item" href="{{ site.baseurl }}{{ page.previous.url }}">
      <span class="post-nav-label mono">← older</span>
      <span class="post-nav-title">{{ page.previous.title }}</span>
    </a>
  {% else %}
    <div class="post-nav-item disabled">
      <span class="post-nav-label mono">← older</span>
      <span class="post-nav-title">-</span>
    </div>
  {% endif %}

  {% if page.next.url %}
    <a class="post-nav-item next" href="{{ site.baseurl }}{{ page.next.url }}">
      <span class="post-nav-label mono">newer →</span>
      <span class="post-nav-title">{{ page.next.title }}</span>
    </a>
  {% else %}
    <div class="post-nav-item next disabled">
      <span class="post-nav-label mono">newer →</span>
      <span class="post-nav-title">-</span>
    </div>
  {% endif %}
</nav>
