<!--
  Jekyll Simple Search loader
  See: <https://github.com/christian-fei/Simple-Jekyll-Search>
-->

{% capture result_elem %}
  <article class="post-item">
    <a class="post-title" href="{url}">{title}</a>
    <p class="post-desc">{content}</p>
    <div class="post-item-meta mono">{categories}{tags}</div>
  </article>
{% endcapture %}

{% capture not_found %}<p class="search-empty mono">no match</p>{% endcapture %}

<script>
  {% comment %} Note: dependent library will be loaded in `js-selector.html` {% endcomment %}
  document.addEventListener('DOMContentLoaded', () => {
    SimpleJekyllSearch({
      searchInput: document.getElementById('search-input'),
      resultsContainer: document.getElementById('search-results'),
      json: '{{ '/assets/js/data/search.json' | relative_url }}',
      searchResultTemplate: '{{ result_elem | strip_newlines }}',
      noResultsText: '{{ not_found }}',
      templateMiddleware: function(prop, value, template) {
        if (prop === 'categories') {
          if (value === '') {
            return `${value}`;
          } else {
            return `${value.replaceAll(', ', ' / ')}`;
          }
        }

        if (prop === 'tags') {
          if (value === '') {
            return `${value}`;
          } else {
            return ` · ${value.split(',').map((t) => '#' + t.trim()).join(' ')}`;
          }
        }
      }
    });

    const $input = document.getElementById('search-input');
    const $results = document.getElementById('search-results');
    const $grep = document.getElementById('search-grep');

    function updateGrep() {
      const query = $input.value.trim();
      const count = $results.querySelectorAll('article').length;
      $grep.textContent = query ? `$ grep "${query}" — ${count} results` : '$ grep';
    }

    $input.addEventListener('input', updateGrep);
    new MutationObserver(updateGrep).observe($results, { childList: true });
  });
</script>
