<!-- The Footer -->

<footer aria-label="Site Info" class="site-footer d-flex align-items-center justify-content-between">
  <p class="mono mb-0">
    {{- '©' }} <time>{{ 'now' | date: '%Y' }}</time> {{ site.social.name -}}
  </p>

  <nav class="footer-index-links mono" aria-label="Site indexes">
    <a href="{{ '/categories/' | relative_url }}">./categories</a>
    <a href="{{ '/tags/' | relative_url }}">./tags</a>
    <a href="{{ '/archives/' | relative_url }}">./archives</a>
  </nav>

  <div class="footer-links d-flex align-items-center">
    {% assign email = site.social.email | split: '@' %}
    <a href="https://github.com/{{ site.github.username }}" aria-label="github" target="_blank" rel="noopener noreferrer">
      <i class="fab fa-github"></i>
    </a>
    <a
      href="javascript:location.href = 'mailto:' + ['{{ email[0] }}','{{ email[1] }}'].join('@')"
      aria-label="email"
    >
      <i class="fas fa-envelope"></i>
    </a>
    <a href="{{ '/feed.xml' | relative_url }}" aria-label="rss">
      <i class="fas fa-rss"></i>
    </a>
  </div>
</footer>
